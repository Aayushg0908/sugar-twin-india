<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sugar Twin · Teleprompter</title>
<style>
  :root { --size: 44px; --line: 32vh; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0a0b; color: #f4f4f5; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  #scroller { position: fixed; inset: 0; overflow-y: scroll; scrollbar-width: none; }
  #scroller::-webkit-scrollbar { display: none; }
  #script { max-width: 980px; margin: 0 auto; padding: calc(var(--line) - 0.2em) 48px 75vh; font-size: var(--size); line-height: 1.45; }
  body.mirror #script { transform: scaleX(-1); }
  .part { margin: 1.6em 0 0.5em; font-size: 0.42em; letter-spacing: 0.08em; text-transform: uppercase; color: #5eead4; font-weight: 700; }
  .part span { color: #71717a; margin-left: 0.8em; font-weight: 500; }
  .cue { margin: 0.6em 0; font-size: 0.5em; font-style: italic; color: #fbbf24; line-height: 1.35; }
  .cue::before { content: "🎬  "; font-style: normal; }
  body.nocues .cue { display: none; }
  .say { margin: 0 0 0.9em; cursor: pointer; transition: opacity .25s; }
  .say.past { opacity: 0.32; }
  .opt { font-size: 0.4em; vertical-align: middle; color: #a1a1aa; border: 1px solid #3f3f46; border-radius: 6px; padding: 0 6px; margin-left: 8px; }
  b { color: #fff; }
  #guide { position: fixed; left: 0; right: 0; top: var(--line); height: calc(var(--size) * 1.5); pointer-events: none;
           border-top: 2px solid rgba(94, 234, 212, .55); background: linear-gradient(rgba(94,234,212,.08), transparent); }
  #guide::before { content: "▶"; position: absolute; left: 14px; top: -0.62em; color: #5eead4; font-size: 22px; }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         justify-content: center; background: rgba(24,24,27,.92); border: 1px solid #27272a; border-radius: 14px; padding: 8px 12px;
         font-size: 13px; color: #d4d4d8; transition: opacity .4s; max-width: calc(100% - 24px); }
  body.playing.idle #bar { opacity: 0; }
  #bar button { background: #27272a; color: #f4f4f5; border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #3f3f46; }
  #bar button.primary { background: #0d9488; font-weight: 700; min-width: 86px; }
  #bar .sep { width: 1px; height: 22px; background: #3f3f46; }
  #bar .val { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
  #status { position: fixed; top: 10px; right: 14px; font-size: 13px; color: #a1a1aa; text-align: right; font-variant-numeric: tabular-nums; }
  #status .t { font-size: 22px; color: #f4f4f5; font-weight: 700; }
  #status .ahead { color: #4ade80; } #status .behind { color: #f87171; }
  #help { position: fixed; top: 10px; left: 14px; font-size: 12px; color: #71717a; line-height: 1.5; }
  body.playing #help { display: none; }
</style>
</head>
<body>
<div id="scroller"><div id="script"></div></div>
<div id="guide"></div>
<div id="status"><div class="t" id="clock">00:00</div><div id="partlabel"></div><div id="pace"></div></div>
<div id="help">
  <b>Space</b> play / pause · <b>↑ ↓</b> speed · <b>+ −</b> text size · <b>← →</b> previous / next part<br>
  <b>Click</b> a line to start from it · <b>C</b> hide screen cues · <b>M</b> mirror (glass teleprompter) · <b>F</b> full screen · <b>R</b> restart
</div>
<div id="bar">
  <button id="play" class="primary">▶ Play</button>
  <span class="sep"></span>
  <button id="slower" title="Slower (↓)">−</button><span class="val" id="wpm"></span><button id="faster" title="Faster (↑)">+</button>
  <span class="sep"></span>
  <button id="smaller" title="Smaller text (−)">A−</button><button id="bigger" title="Bigger text (+)">A+</button>
  <span class="sep"></span>
  <button id="prev" title="Previous part (←)">⏮ Part</button><button id="next" title="Next part (→)">Part ⏭</button>
  <button id="cues" title="Show / hide screen cues (C)">Cues</button>
  <button id="mirror" title="Mirror for a glass teleprompter (M)">Mirror</button>
  <button id="restart" title="Back to the start (R)">Restart</button>
</div>
<script>
const SEGMENTS = /*__SEGMENTS__*/[];
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem("tp-" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("tp-" + k, JSON.stringify(v)); } catch {} } };
const state = { playing: false, wpm: store.get("wpm", 140), size: store.get("size", 44), elapsed: 0, pos: 0 };
const toSec = (mmss) => { const [m, s] = mmss.split(":").map(Number); return m * 60 + s; };
const fmt = (s) => `${String(Math.floor(Math.abs(s) / 60)).padStart(2, "0")}:${String(Math.floor(Math.abs(s) % 60)).padStart(2, "0")}`;
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// ---- render the script
const script = $("script"), scroller = $("scroller");
const nodes = [];
for (const p of SEGMENTS) {
  const h = document.createElement("div");
  h.className = "part"; h.innerHTML = `Part ${p.n} · ${esc(p.title)}<span>${p.start} – ${p.end}</span>`;
  h.dataset.kind = "part"; h.dataset.part = p.n; script.appendChild(h); nodes.push(h);
  for (const it of p.items) {
    const el = document.createElement(it.type === "cue" ? "div" : "p");
    el.className = it.type === "cue" ? "cue" : "say";
    el.innerHTML = esc(it.text) + (it.optional ? '<span class="opt">optional</span>' : "");
    el.dataset.kind = it.type; el.dataset.part = p.n; el.dataset.words = it.text.split(/\s+/).length;
    script.appendChild(el); nodes.push(el);
  }
}
const lineY = () => window.innerHeight * parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--line")) / 100;
const currentNode = () => {
  const y = scroller.scrollTop + lineY();
  let cur = nodes[0];
  for (const n of nodes) { if (n.offsetTop <= y + 2) cur = n; else break; }
  return cur;
};

// ---- auto-scroll at the chosen words-per-minute
// Driven by a timer + real clock (not requestAnimationFrame), so it keeps time even if the window is partly covered.
let last = null;
function frame(t) {
  if (state.playing) {
    const dt = last === null ? 0 : (t - last) / 1000;
    state.elapsed += dt;
    const n = currentNode();
    const h = n.offsetHeight + parseFloat(getComputedStyle(n).marginBottom);
    const speed = n.dataset.kind === "say"
      ? (state.wpm / 60) * (h / Math.max(1, +n.dataset.words))   // read at the target pace
      : (document.body.classList.contains("nocues") && n.dataset.kind === "cue" ? 2000 : h / 1.8);  // glide past cues / headers
    state.pos += speed * dt;
    scroller.scrollTop = state.pos;
    if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) setPlaying(false);
  }
  last = t;
  status();
}
let lastCur = null;
function status() {
  const n = currentNode();
  if (n !== lastCur) {
    lastCur = n;
    let past = true;
    for (const x of nodes) { if (x === n) past = false; if (x.dataset.kind === "say") x.classList.toggle("past", past); }
  }
  const p = SEGMENTS.find((s) => s.n === +n.dataset.part);
  $("clock").textContent = fmt(state.elapsed);
  $("partlabel").textContent = p ? `Part ${p.n}: ${p.title} · target ${p.start} – ${p.end}` : "";
  if (p && state.elapsed > 0) {
    const d = state.elapsed - toSec(p.start);
    const el = $("pace");
    if (state.elapsed < toSec(p.start)) { el.className = "ahead"; el.textContent = `${fmt(toSec(p.start) - state.elapsed)} ahead of plan`; }
    else if (state.elapsed > toSec(p.end)) { el.className = "behind"; el.textContent = `${fmt(state.elapsed - toSec(p.end))} over this part`; }
    else { el.className = ""; el.textContent = "on time"; }
  }
}
setInterval(() => frame(performance.now()), 30);

// ---- controls
function setPlaying(on) {
  state.playing = on; state.pos = scroller.scrollTop; last = null;
  document.body.classList.toggle("playing", on);
  $("play").textContent = on ? "⏸ Pause" : "▶ Play";
}
function setWpm(v) { state.wpm = Math.max(80, Math.min(220, v)); $("wpm").textContent = `${state.wpm} wpm`; store.set("wpm", state.wpm); }
function setSize(v) { state.size = Math.max(24, Math.min(96, v)); document.documentElement.style.setProperty("--size", state.size + "px"); store.set("size", state.size); }
function jumpTo(el) { const y = el.offsetTop - lineY(); scroller.scrollTop = y; state.pos = scroller.scrollTop; }
function jumpPart(delta) {
  const cur = +currentNode().dataset.part;
  const target = nodes.find((x) => x.dataset.kind === "part" && +x.dataset.part === cur + delta);
  if (target) jumpTo(target);
}
$("play").onclick = () => setPlaying(!state.playing);
$("slower").onclick = () => setWpm(state.wpm - 5);
$("faster").onclick = () => setWpm(state.wpm + 5);
$("smaller").onclick = () => setSize(state.size - 4);
$("bigger").onclick = () => setSize(state.size + 4);
$("prev").onclick = () => jumpPart(-1);
$("next").onclick = () => jumpPart(1);
$("cues").onclick = () => document.body.classList.toggle("nocues");
$("mirror").onclick = () => document.body.classList.toggle("mirror");
$("restart").onclick = () => { setPlaying(false); state.elapsed = 0; scroller.scrollTop = 0; state.pos = 0; };
script.addEventListener("click", (e) => { const p = e.target.closest(".say"); if (p) jumpTo(p); });
scroller.addEventListener("wheel", () => { state.pos = scroller.scrollTop; }, { passive: true });
scroller.addEventListener("scroll", () => { if (!state.playing) state.pos = scroller.scrollTop; });
document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " ") { e.preventDefault(); setPlaying(!state.playing); }
  else if (k === "ArrowUp") { e.preventDefault(); setWpm(state.wpm + 5); }
  else if (k === "ArrowDown") { e.preventDefault(); setWpm(state.wpm - 5); }
  else if (k === "+" || k === "=") setSize(state.size + 4);
  else if (k === "-" || k === "_") setSize(state.size - 4);
  else if (k === "ArrowRight" || k === "PageDown") jumpPart(1);
  else if (k === "ArrowLeft" || k === "PageUp") jumpPart(-1);
  else if (k === "c" || k === "C") document.body.classList.toggle("nocues");
  else if (k === "m" || k === "M") document.body.classList.toggle("mirror");
  else if (k === "r" || k === "R") $("restart").click();
  else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
let idle; document.addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("idle"), 2000); });
setWpm(state.wpm); setSize(state.size);
</script>
</body>
</html>
