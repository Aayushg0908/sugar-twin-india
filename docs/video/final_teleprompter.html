<script>
const LINES = [{"start": 2.04, "end": 7.18, "text": "A person with diabetes sees their doctor maybe four times a year.", "part": 1, "title": "Hook and team"}, {"start": 7.18, "end": 15.33, "text": "In between those visits, their blood sugar rises and falls hundreds of times a day, and nobody is watching.", "part": 1, "title": "Hook and team"}, {"start": 15.33, "end": 20.47, "text": "Now imagine every patient had a virtual copy of their own body.", "part": 1, "title": "Hook and team"}, {"start": 20.47, "end": 29.05, "text": "A copy that could warn the doctor about a dangerous spike or a dangerous low, two hours before it happens.", "part": 1, "title": "Hook and team"}, {"start": 29.05, "end": 40.2, "text": "And a copy on which the doctor could test advice, like a smaller dinner or a short walk, before giving that advice to the real patient.", "part": 1, "title": "Hook and team"}, {"start": 40.2, "end": 42.35, "text": "That is what we built.", "part": 1, "title": "Hook and team"}, {"start": 42.35, "end": 48.78, "text": "This is Sugar Twin India, our entry for the Happiest Health Digital Twin Challenge 2026.", "part": 1, "title": "Hook and team"}, {"start": 50.7, "end": 61.41, "text": "I am Aayush Gupta, the team leader, and I am presenting on behalf of our team of three from Maharaja Agrasen Institute of Technology, Delhi.", "part": 1, "title": "Hook and team"}, {"start": 61.41, "end": 75.13, "text": "With me on this project are Dhruv Gandhi, who worked on the machine-learning models and how we tested them, and Divyansh Singh, who worked on the data, its validation and the documentation.", "part": 1, "title": "Hook and team"}, {"start": 75.13, "end": 78.99, "text": "I built the data simulator and the doctor dashboard.", "part": 1, "title": "Hook and team"}, {"start": 78.99, "end": 91.0, "text": "In the next twenty minutes I will show you the problem, how our twin works, a live demo, and our results, including the parts that did not work.", "part": 1, "title": "Hook and team"}, {"start": 92.94, "end": 99.81, "text": "India has about 101 million people living with diabetes, according to the ICMR-INDIAB study from 2023.", "part": 2, "title": "The problem"}, {"start": 99.81, "end": 105.82, "text": "Most of them have Type 2 diabetes, so that is the condition we chose.", "part": 2, "title": "The problem"}, {"start": 105.82, "end": 110.54, "text": "The real damage in diabetes does not happen in the clinic.", "part": 2, "title": "The problem"}, {"start": 110.54, "end": 112.26, "text": "It happens between visits.", "part": 2, "title": "The problem"}, {"start": 112.26, "end": 115.27, "text": "A rice-heavy lunch sends glucose above 250.", "part": 2, "title": "The problem"}, {"start": 115.27, "end": 118.71, "text": "A late dinner keeps it high all night.", "part": 2, "title": "The problem"}, {"start": 118.71, "end": 125.58, "text": "A wedding or a festival, a missed tablet, a fever, all of these push sugar up.", "part": 2, "title": "The problem"}, {"start": 125.58, "end": 136.73, "text": "And for patients on sulfonylureas or insulin, the opposite danger is a low, often early in the morning, which can make someone dizzy, confused, or worse.", "part": 2, "title": "The problem"}, {"start": 136.73, "end": 139.31, "text": "Today, technology already collects this data.", "part": 2, "title": "The problem"}, {"start": 139.31, "end": 144.46, "text": "A continuous glucose monitor, or CGM, records a reading every five minutes.", "part": 2, "title": "The problem"}, {"start": 144.46, "end": 147.03, "text": "That is 288 readings a day.", "part": 2, "title": "The problem"}, {"start": 147.03, "end": 150.47, "text": "A smartwatch adds heart rate, sleep and steps.", "part": 2, "title": "The problem"}, {"start": 150.47, "end": 152.62, "text": "But this creates two problems.", "part": 2, "title": "The problem"}, {"start": 152.62, "end": 158.21, "text": "First, a doctor cannot read 288 numbers a day for hundreds of patients.", "part": 2, "title": "The problem"}, {"start": 158.21, "end": 161.22, "text": "Second, a CGM only shows the past.", "part": 2, "title": "The problem"}, {"start": 161.22, "end": 164.23, "text": "It tells you that glucose was high.", "part": 2, "title": "The problem"}, {"start": 164.23, "end": 169.37, "text": "It does not tell you that it is about to be high.", "part": 2, "title": "The problem"}, {"start": 169.37, "end": 179.23, "text": "At the same time, the hospital record knows a lot about the patient: their HbA1c, their kidney function, their medicines, even genetic risk.", "part": 2, "title": "The problem"}, {"start": 179.23, "end": 184.81, "text": "But that record is not connected to the live stream from the sensor.", "part": 2, "title": "The problem"}, {"start": 184.81, "end": 186.97, "text": "So the challenge is clear.", "part": 2, "title": "The problem"}, {"start": 186.97, "end": 190.4, "text": "Fuse the health record with the live data.", "part": 2, "title": "The problem"}, {"start": 190.4, "end": 192.99, "text": "Predict the event before it happens.", "part": 2, "title": "The problem"}, {"start": 192.99, "end": 198.57, "text": "And turn it into something a busy doctor can act on in seconds.", "part": 2, "title": "The problem"}, {"start": 200.54, "end": 207.4, "text": "Our answer is a digital twin of each patient that does three things for the doctor.", "part": 3, "title": "Our idea and how it works"}, {"start": 207.4, "end": 208.26, "text": "One, triage.", "part": 3, "title": "Our idea and how it works"}, {"start": 208.26, "end": 211.69, "text": "Every patient is sorted by risk right now.", "part": 3, "title": "Our idea and how it works"}, {"start": 211.69, "end": 216.41, "text": "Urgent means a low, or a reading above 250, is likely.", "part": 3, "title": "Our idea and how it works"}, {"start": 216.41, "end": 219.84, "text": "Watch means a spike above 180 is likely.", "part": 3, "title": "Our idea and how it works"}, {"start": 219.84, "end": 221.13, "text": "Two, early warning.", "part": 3, "title": "Our idea and how it works"}, {"start": 221.13, "end": 233.13, "text": "For each patient, the twin predicts a spike above 180, above 250, or a low below 70, up to two hours ahead, and explains why in plain language.", "part": 3, "title": "Our idea and how it works"}, {"start": 233.13, "end": 234.86, "text": "Three, advice tested first.", "part": 3, "title": "Our idea and how it works"}, {"start": 234.86, "end": 246.02, "text": "The twin learns how this particular patient's body responds to food and walking, so the doctor can try a change on the twin before suggesting it.", "part": 3, "title": "Our idea and how it works"}, {"start": 255.08, "end": 258.52, "text": "Here is the whole system in one picture.", "part": 3, "title": "Our idea and how it works"}, {"start": 258.52, "end": 270.53, "text": "On the left, the two data streams: a synthetic health record for five thousand Indian patients, and fourteen days of CGM and smartwatch data for each of them.", "part": 3, "title": "Our idea and how it works"}, {"start": 270.53, "end": 282.12, "text": "In the middle, every thirty minutes we fuse both streams into one row of 97 features, using only what a real app would know at that moment.", "part": 3, "title": "Our idea and how it works"}, {"start": 282.12, "end": 283.84, "text": "Nothing from the future.", "part": 3, "title": "Our idea and how it works"}, {"start": 283.84, "end": 287.27, "text": "Those features go into two kinds of models.", "part": 3, "title": "Our idea and how it works"}, {"start": 287.27, "end": 292.84, "text": "Machine-learning models, LightGBM and a GRU neural network, predict what will happen next.", "part": 3, "title": "Our idea and how it works"}, {"start": 292.84, "end": 300.13, "text": "Next to them, a personal physiology twin learns how this patient's body works and answers what-if questions.", "part": 3, "title": "Our idea and how it works"}, {"start": 300.14, "end": 307.86, "text": "On the right, a FastAPI service and a React dashboard put it all in front of the doctor.", "part": 3, "title": "Our idea and how it works"}, {"start": 312.4, "end": 319.69, "text": "Let me start with an important point about the data: every patient in this project is synthetic.", "part": 4, "title": "The data: two streams, one body"}, {"start": 319.69, "end": 328.7, "text": "Real patient data is protected by India's DPDP Act and by HIPAA, and the challenge asks for synthetic or open data.", "part": 4, "title": "The data: two streams, one body"}, {"start": 328.7, "end": 334.7, "text": "So we built our own population, carefully, and then checked it against real-world numbers.", "part": 4, "title": "The data: two streams, one body"}, {"start": 334.7, "end": 337.71, "text": "The static stream is the health record.", "part": 4, "title": "The data: two streams, one body"}, {"start": 337.71, "end": 346.71, "text": "We generated five thousand Indian adults: three thousand with Type 2 diabetes, one thousand with prediabetes and one thousand without diabetes.", "part": 4, "title": "The data: two streams, one body"}, {"start": 346.71, "end": 354.44, "text": "Each has demographics, lifestyle and a regional diet, rice in the south and east, wheat in the north.", "part": 4, "title": "The data: two streams, one body"}, {"start": 354.44, "end": 369.02, "text": "They have diagnoses coded in ICD-10, three years of lab results and vitals coded in LOINC, and medicines that follow a realistic treatment ladder: metformin first, then a second drug, then insulin if needed.", "part": 4, "title": "The data: two streams, one body"}, {"start": 369.02, "end": 376.31, "text": "We also added genetic markers: four known diabetes risk genes, like TCF7L2, and a polygenic risk score.", "part": 4, "title": "The data: two streams, one body"}, {"start": 376.31, "end": 379.32, "text": "The dynamic stream is the wearable data.", "part": 4, "title": "The data: two streams, one body"}, {"start": 379.32, "end": 387.9, "text": "For every patient we simulated fourteen days at five-minute resolution: CGM glucose, heart rate, heart-rate variability, steps and sleep stages.", "part": 4, "title": "The data: two streams, one body"}, {"start": 387.9, "end": 391.34, "text": "That is about twenty million readings per stream.", "part": 4, "title": "The data: two streams, one body"}, {"start": 391.34, "end": 396.92, "text": "On top of that, an app log of meals, medicine doses and exercise.", "part": 4, "title": "The data: two streams, one body"}, {"start": 396.92, "end": 399.93, "text": "We made it feel Indian and real.", "part": 4, "title": "The data: two streams, one body"}, {"start": 399.93, "end": 406.37, "text": "Breakfast around 8:30, lunch around 1:30, chai at 5, and a late dinner around 9.", "part": 4, "title": "The data: two streams, one body"}, {"start": 406.37, "end": 408.52, "text": "Idli, dosa, rajma-chawal, roti-sabzi, biryani.", "part": 4, "title": "The data: two streams, one body"}, {"start": 408.52, "end": 411.52, "text": "Wedding feasts, fasting days, illness, missed doses.", "part": 4, "title": "The data: two streams, one body"}, {"start": 411.52, "end": 417.53, "text": "And just like real patients, people only log about sixty percent of their meals.", "part": 4, "title": "The data: two streams, one body"}, {"start": 419.26, "end": 423.12, "text": "The key design idea is one body, two streams.", "part": 4, "title": "The data: two streams, one body"}, {"start": 423.12, "end": 435.56, "text": "Both streams are generated from the same hidden physiology for each person: how sensitive they are to insulin, how well their pancreas works, how regularly they take their medicines.", "part": 4, "title": "The data: two streams, one body"}, {"start": 435.56, "end": 440.71, "text": "So the lab HbA1c and the CGM curve agree with each other.", "part": 4, "title": "The data: two streams, one body"}, {"start": 440.71, "end": 447.15, "text": "The HbA1c estimated from the CGM matches the lab HbA1c with a correlation of 0.93.", "part": 4, "title": "The data: two streams, one body"}, {"start": 447.15, "end": 453.58, "text": "And these hidden values are never given to the models, so the models cannot cheat.", "part": 4, "title": "The data: two streams, one body"}, {"start": 453.58, "end": 454.87, "text": "Then we validated.", "part": 4, "title": "The data: two streams, one body"}, {"start": 454.87, "end": 463.87, "text": "The health record matches Indian studies: average HbA1c of 7.8 percent in diabetics, 45 percent with hypertension, 89 percent on metformin.", "part": 4, "title": "The data: two streams, one body"}, {"start": 463.87, "end": 466.88, "text": "All 14 of our literature checks passed.", "part": 4, "title": "The data: two streams, one body"}, {"start": 466.88, "end": 470.74, "text": "The wearable data passed all 16 of its checks.", "part": 4, "title": "The data: two streams, one body"}, {"start": 470.74, "end": 474.18, "text": "Most importantly, we compared it with real patients.", "part": 4, "title": "The data: two streams, one body"}, {"start": 474.18, "end": 481.05, "text": "We used ShanghaiT2DM, a public dataset of real CGM recordings from people with Type 2 diabetes.", "part": 4, "title": "The data: two streams, one body"}, {"start": 481.05, "end": 489.2, "text": "At the same average glucose level, real patients spend 83.5 percent of their time in range; ours spend 82.3.", "part": 4, "title": "The data: two streams, one body"}, {"start": 489.2, "end": 492.64, "text": "Time above 180: 14.6 percent real, 14.9 ours.", "part": 4, "title": "The data: two streams, one body"}, {"start": 492.64, "end": 497.79, "text": "And after a meal, glucose peaks about 90 minutes later in both.", "part": 4, "title": "The data: two streams, one body"}, {"start": 497.79, "end": 508.09, "text": "Our meals cause bigger rises, which is expected, because rice and roti meals carry more carbohydrate than the small hospital meals in that study.", "part": 4, "title": "The data: two streams, one body"}, {"start": 510.07, "end": 511.37, "text": "Next, the models.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 511.37, "end": 517.81, "text": "We used two kinds of twin, because we found that one kind cannot do everything.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 517.81, "end": 519.53, "text": "The first kind predicts.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 519.53, "end": 524.68, "text": "Every thirty minutes, we build one row per patient with 97 features.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 524.68, "end": 542.7, "text": "These include the last six hours of glucose and its trend, what this patient's glucose usually does at this time of day, logged meals and doses, steps, heart rate and last night's sleep, plus the health record: HbA1c, kidney function, medicines, genetics.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 542.7, "end": 545.27, "text": "That gives us 3.2 million rows.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 545.27, "end": 555.99, "text": "We split them by patient: 70 percent of patients for training, 15 percent for tuning, and 15 percent, 750 patients, kept completely unseen for testing.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 555.99, "end": 569.72, "text": "On this data we trained LightGBM, seven models: three alerts, for a spike above 180, above 250 and a low below 70, and four forecasts, 30, 60, 90 and 120 minutes ahead.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 569.72, "end": 577.44, "text": "LightGBM also tells us why it made each prediction, through SHAP values, which we turn into plain-language reasons.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 577.44, "end": 587.73, "text": "We also trained a GRU, a deep-learning model that reads the raw six-hour sequence, eleven channels every five minutes, together with the health record.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 587.73, "end": 592.01, "text": "It trains on a laptop GPU in about seven minutes.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 592.01, "end": 599.3, "text": "The final prediction is the simple average of both models, with nothing tuned on the test patients.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 599.3, "end": 601.88, "text": "The second kind of twin simulates.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 601.88, "end": 611.31, "text": "During testing we discovered something important: if we add a meal or a walk to the inputs, the machine-learning models barely react.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 611.31, "end": 614.31, "text": "They learned correlation, not cause and effect.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 614.31, "end": 636.18, "text": "So for what-if questions we built a personal physiology twin: equations for how food is absorbed and how glucose comes back down, with three settings learned for each patient from their own first week: how much sugar rises per portion of carbohydrate, how quickly it recovers, and how much walking helps.", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 636.18, "end": 643.04, "text": "The machine-learning models answer \"what will happen?\" The physiology twin answers \"what if we change something?\"", "part": 5, "title": "The models: one predicts, one simulates"}, {"start": 644.47, "end": 649.19, "text": "Now let me show you how a doctor would use this.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 650.26, "end": 652.85, "text": "First, the strip at the top.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 652.85, "end": 660.56, "text": "This prototype replays fourteen recorded days, so we can move through time and watch the twin at work.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 660.56, "end": 665.29, "text": "In a real clinic, this would simply be the live clock.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 667.18, "end": 673.19, "text": "Right now it is Saturday, the 26th of September, at 7:30 in the evening.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 674.24, "end": 677.67, "text": "On the left is the doctor's patient list.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 677.67, "end": 679.82, "text": "751 patients are being monitored.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 679.82, "end": 687.11, "text": "55 are urgent: a low, or a reading above 250, is likely in the next two hours.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 687.11, "end": 691.4, "text": "58 are on watch: a spike above 180 is likely.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 691.4, "end": 697.41, "text": "The list is sorted by risk, so the doctor always starts at the top.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 699.35, "end": 701.08, "text": "Take this patient, P00152.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 701.08, "end": 704.08, "text": "Her glucose is 93, which looks fine.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 704.08, "end": 707.1, "text": "But the twin says low sugar likely.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 707.1, "end": 707.53, "text": "Why?", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 707.53, "end": 716.97, "text": "Her glucose has dropped about 60 points in the last two hours and is lower than usual for this time of day.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 716.97, "end": 723.4, "text": "Its suggestion is simple: take 15 grams of fast sugar and recheck in 15 minutes.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 723.4, "end": 726.83, "text": "That is a low caught before it happens.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 728.72, "end": 734.73, "text": "This patient is the opposite: already at 242, with a reading above 250 likely.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 734.73, "end": 739.03, "text": "Two patients, two very different problems, both visible in seconds.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 740.91, "end": 743.06, "text": "Now our demo patient, Sunita.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 743.06, "end": 753.34, "text": "She is 48, from South India, eats rice-based meals, has had diabetes for three years, and takes metformin, glimepiride and two more diabetes medicines.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 753.34, "end": 759.35, "text": "She was created separately, outside our dataset, so no model has ever seen her.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 761.99, "end": 765.0, "text": "This clinical summary is the thirty-second read.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 765.0, "end": 779.15, "text": "On the left: right now her glucose is 123 and steady, but it could go above 180 in the next two hours, because it usually peaks near 220 after this time of day.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 779.15, "end": 794.15, "text": "On the right are the findings from the last fourteen days, and the first one matters most: low sugar ten percent of the time, against a target of under four percent, mostly in the morning.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 794.15, "end": 799.31, "text": "The twin suggests reviewing her glimepiride, a medicine known to cause lows.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 799.31, "end": 810.04, "text": "It also flags that only 54 percent of her time is in range and that only about half her doses were confirmed in the app.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 810.04, "end": 814.77, "text": "A doctor sees all of that without opening a single chart.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 817.5, "end": 823.93, "text": "Here is her glucose over the last twelve hours: the black line is the CGM.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 823.93, "end": 832.95, "text": "The blue dashed line is the twin's forecast for the next two hours, and the shaded band is the likely range.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 832.95, "end": 841.09, "text": "The circles are meals she logged, with their carbs, and the dots at the top are her medicine doses.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 841.09, "end": 844.52, "text": "You can hover over any marker for details.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 846.46, "end": 854.18, "text": "Because this is a replay, we can do something a real clinic cannot: reveal what actually happened next.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 854.18, "end": 861.48, "text": "The grey line is the real glucose after \"now\", and you can see the forecast followed it.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 863.37, "end": 865.09, "text": "Now watch the replay.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 865.09, "end": 868.09, "text": "Time moves forward thirty minutes every second.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 868.09, "end": 872.39, "text": "Keep an eye on the high-sugar card on the right.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 874.85, "end": 880.86, "text": "It turns from unlikely, to possible, to likely, before the glucose line crosses 180.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 880.86, "end": 884.72, "text": "That is the early warning the challenge asked for.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 889.18, "end": 893.9, "text": "The reasons come from the model itself, rewritten in plain language.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 893.9, "end": 900.33, "text": "For example: \"usually peaks near 220 after this time of day\", and \"high for hours\".", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 900.33, "end": 904.2, "text": "Only reasons a doctor can act on are shown.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 906.91, "end": 908.63, "text": "Now the personal twin.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 908.63, "end": 918.92, "text": "For Sunita it suggests: at the next meal, swap her usual large rice meal for a smaller low-GI one, like roti, dal and salad.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 918.92, "end": 923.65, "text": "Her twin estimates that lowers her peak by about 37 points.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 923.65, "end": 928.37, "text": "Or walk for twenty minutes, starting half an hour after eating.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 932.38, "end": 935.39, "text": "These numbers come from her own data.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 935.39, "end": 949.1, "text": "Her twin learned that her sugar rises about 17 points for every roti-sized portion of carbs, more than average, and takes about four and a half hours to settle after a meal.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 950.99, "end": 955.28, "text": "When the doctor clicks \"Try it\", the what-if simulator opens.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 955.28, "end": 958.29, "text": "The dotted line is her usual meal.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 958.29, "end": 963.01, "text": "The solid line is the same meal with a twenty-minute walk.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 964.91, "end": 972.2, "text": "Now I change the food type from rice to roti and dal, and the peak drops further.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 974.06, "end": 978.35, "text": "If I mark a skipped dose, the curve goes up.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 978.35, "end": 985.64, "text": "The doctor can see the effect of each choice on this patient's body before giving the advice.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 990.87, "end": 1001.16, "text": "Below, the doctor has the full health record: latest labs, medicines, diagnoses and her HbA1c trend over three years, and her genetic risk markers.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 1007.4, "end": 1011.26, "text": "And there is a dark theme, for night shifts.", "part": 6, "title": "Live demo: the doctor dashboard"}, {"start": 1014.25, "end": 1016.4, "text": "Now, how good is it?", "part": 7, "title": "Results"}, {"start": 1016.4, "end": 1022.4, "text": "Every number here is on the 750 test patients that the models never saw.", "part": 7, "title": "Results"}, {"start": 1022.4, "end": 1029.7, "text": "For the main alert, a spike above 180 in the next two hours, the AUROC is 0.958.", "part": 7, "title": "Results"}, {"start": 1029.7, "end": 1034.43, "text": "A simple rule that just follows the current trend gets 0.71.", "part": 7, "title": "Results"}, {"start": 1034.43, "end": 1039.15, "text": "For diabetics only, which is the harder group, it is 0.924.", "part": 7, "title": "Results"}, {"start": 1039.15, "end": 1043.01, "text": "95 percent of spikes were flagged before they happened.", "part": 7, "title": "Results"}, {"start": 1043.01, "end": 1055.44, "text": "When we set the alert to catch 80 percent of spikes, three out of four alerts are correct, at about one and a half alerts per patient per day.", "part": 7, "title": "Results"}, {"start": 1055.44, "end": 1062.72, "text": "For lows below 70, the AUROC is 0.978, and 94.5 percent of lows were flagged in advance.", "part": 7, "title": "Results"}, {"start": 1062.73, "end": 1068.3, "text": "For the glucose forecast one hour ahead, the average error is 13.8 mg/dL.", "part": 7, "title": "Results"}, {"start": 1068.3, "end": 1073.46, "text": "If you simply assume glucose stays the same, the error is 21.3.", "part": 7, "title": "Results"}, {"start": 1073.46, "end": 1076.04, "text": "At two hours: 17.1 against 31.7.", "part": 7, "title": "Results"}, {"start": 1083.1, "end": 1086.1, "text": "Does fusing the two streams actually help?", "part": 7, "title": "Results"}, {"start": 1086.1, "end": 1087.39, "text": "We tested it.", "part": 7, "title": "Results"}, {"start": 1087.39, "end": 1090.83, "text": "CGM alone gives a spike AUROC of 0.952.", "part": 7, "title": "Results"}, {"start": 1090.83, "end": 1104.12, "text": "Adding the smartwatch and app logs raises it, adding the health record raises it, and the full fusion is best, at 0.956, with the one-hour error falling from 14.8 to 13.9.", "part": 7, "title": "Results"}, {"start": 1104.12, "end": 1110.98, "text": "The gains are modest, because the CGM is the strongest signal, but each stream adds something.", "part": 7, "title": "Results"}, {"start": 1110.98, "end": 1115.27, "text": "For lows, the CGM alone does almost all the work.", "part": 7, "title": "Results"}, {"start": 1116.51, "end": 1118.66, "text": "And does personal beat average?", "part": 7, "title": "Results"}, {"start": 1118.66, "end": 1131.1, "text": "When the twin predicts the rise after a brand-new meal, using what it learned in the first week, its error is 25 mg/dL, against 31 for a one-size-fits-all model.", "part": 7, "title": "Results"}, {"start": 1131.1, "end": 1137.53, "text": "Its learned carb sensitivity matches each patient's hidden true value with a correlation of 0.92.", "part": 7, "title": "Results"}, {"start": 1139.53, "end": 1143.82, "text": "We also tested it the way it will be used.", "part": 7, "title": "Results"}, {"start": 1143.82, "end": 1154.54, "text": "On a new user's first day, without meal logging, without a smartwatch, and with a noisier sensor, the spike AUROC stays between 0.94 and 0.96.", "part": 7, "title": "Results"}, {"start": 1154.54, "end": 1163.11, "text": "That means the system can work with just a CGM, which matters in India, where not everyone has a smartwatch.", "part": 7, "title": "Results"}, {"start": 1163.11, "end": 1170.84, "text": "We also ran 24 clinical scenario checks, including feasts, missed doses, illness, fasting on sulfonylureas and night-time lows.", "part": 7, "title": "Results"}, {"start": 1170.84, "end": 1171.7, "text": "19 passed.", "part": 7, "title": "Results"}, {"start": 1171.7, "end": 1181.99, "text": "The 5 that failed were what-if checks on the machine-learning models, and that failure is exactly why the physiology twin answers what-if questions instead.", "part": 7, "title": "Results"}, {"start": 1181.99, "end": 1186.71, "text": "One more finding : knowing every past meal perfectly barely helps.", "part": 7, "title": "Results"}, {"start": 1186.71, "end": 1190.58, "text": "The biggest gain comes from knowing the next meal.", "part": 7, "title": "Results"}, {"start": 1190.58, "end": 1198.31, "text": "If a patient shares a simple meal plan, the spike AUROC for diabetics rises from 0.92 to 0.96.", "part": 7, "title": "Results"}, {"start": 1200.35, "end": 1203.78, "text": "I want to be honest about the limits.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1203.78, "end": 1206.36, "text": "First, all our data is synthetic.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1206.36, "end": 1215.36, "text": "We validated it carefully, including against real patients, but accuracy on real patients will be lower than what you have seen.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1215.36, "end": 1226.08, "text": "Second, the physiology twin uses the same kind of equations as our simulator, so how well it recovers each patient's physiology is a best case.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1226.08, "end": 1234.24, "text": "Third, the low-sugar alert is sensitive but not precise: about three out of four low alerts are false alarms.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1234.24, "end": 1240.67, "text": "For lows, we chose to warn early rather than miss one, but this needs work.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1240.67, "end": 1246.25, "text": "Our next steps: validate on real, consented CGM data with a partner hospital.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1246.25, "end": 1250.55, "text": "Keep re-fitting each patient's twin as new meals are logged.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1250.55, "end": 1258.7, "text": "Build a patient app with an \"I'm about to eat\" button, which our experiments show improves predictions the most.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1258.7, "end": 1265.58, "text": "And extend the same fusion of health records and wearables to blood pressure and heart risk.", "part": 8, "title": "Honest limits and next steps"}, {"start": 1267.56, "end": 1276.57, "text": "A doctor with hundreds of patients has two questions every morning: who needs me now, and what should I tell them?", "part": 9, "title": "Close"}, {"start": 1276.57, "end": 1284.28, "text": "Sugar Twin India answers both, two hours before the event, with advice tested on each patient's own twin.", "part": 9, "title": "Close"}, {"start": 1284.28, "end": 1292.87, "text": "Everything, the data, the models, the dashboard and every result you have seen, is open source on GitHub at github.com/Aayushg0908/sugar-twin-india.", "part": 9, "title": "Close"}, {"start": 1292.87, "end": 1294.59, "text": "Thank you for watching.", "part": 9, "title": "Close"}];
const $ = (id) => document.getElementById(id);
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const video = $("video"), script = $("script");
let hasVideo = false, playing = false, clock = 0, last = null;

// ---- render
const rows = [];
let part = null;
for (const l of LINES) {
  if (l.part !== part) {
    part = l.part;
    const h = document.createElement("div");
    h.className = "part"; h.textContent = `Part ${l.part} · ${l.title}`;
    script.appendChild(h);
  }
  const p = document.createElement("p");
  p.className = "s"; p.innerHTML = `<span class="t">${fmt(l.start)}</span>${esc(l.text)}`;
  p.onclick = () => seek(l.start);
  script.appendChild(p); rows.push(p);
}

// ---- time source: the video when it is next to this file, otherwise an internal clock
video.addEventListener("loadedmetadata", () => { hasVideo = true; $("mode").textContent = "synced to final_video.webm"; });
video.addEventListener("error", () => { hasVideo = false; document.body.classList.add("novideo"); $("mode").textContent = "no video found: using the built-in clock"; });
const now = () => (hasVideo ? video.currentTime : clock);
function seek(t) { t = Math.max(0, t); if (hasVideo) video.currentTime = t; clock = t; tick(true); }
function setPlaying(on) {
  playing = on; last = null;
  document.body.classList.toggle("playing", on);
  if (hasVideo) on ? video.play() : video.pause();
}
function start() {
  if (playing) return setPlaying(false);
  if (now() > 0.5) return setPlaying(true);
  let n = 3; const c = $("count"); c.style.display = "flex"; c.textContent = n;
  const id = setInterval(() => { n--; if (n === 0) { clearInterval(id); c.style.display = "none"; setPlaying(true); } else c.textContent = n; }, 1000);
}

// ---- scroll so the current sentence sits on the reading line, gliding toward the next one
const lineY = () => innerHeight * parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--line")) / 100;
let shown = -1;
function tick(jump) {
  const t0 = performance.now();
  if (playing && !hasVideo) { if (last !== null) clock += (t0 - last) / 1000; last = t0; }
  const t = now();
  let i = 0;
  while (i + 1 < LINES.length && LINES[i + 1].start <= t) i++;
  if (i !== shown) { rows.forEach((r, k) => { r.classList.toggle("now", k === i); r.classList.toggle("past", k < i); }); shown = i; }
  const a = rows[i], b = rows[i + 1];
  let y = a.offsetTop;
  if (b && t >= LINES[i].end) {
    const f = Math.min(1, (t - LINES[i].end) / Math.max(0.3, LINES[i + 1].start - LINES[i].end));
    y += (b.offsetTop - a.offsetTop) * f;
  }
  const target = y - lineY();
  const sc = $("scroller");
  sc.scrollTop = jump ? target : sc.scrollTop + (target - sc.scrollTop) * 0.18;
  $("clock").textContent = fmt(t);
  $("partlabel").textContent = `Part ${LINES[i].part}: ${LINES[i].title}`;
  if (!hasVideo && playing && t > LINES[LINES.length - 1].end + 3) setPlaying(false);
}
setInterval(() => tick(false), 30);

// ---- keys
let size = 42;
const setSize = (v) => { size = Math.max(24, Math.min(96, v)); document.documentElement.style.setProperty("--size", size + "px"); };
document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " ") { e.preventDefault(); start(); }
  else if (k === "ArrowLeft") seek(now() - 5);
  else if (k === "ArrowRight") seek(now() + 5);
  else if (k === "+" || k === "=") setSize(size + 4);
  else if (k === "-" || k === "_") setSize(size - 4);
  else if (k === "v" || k === "V") document.body.classList.toggle("novideo");
  else if (k === "m" || k === "M") document.body.classList.toggle("mirror");
  else if (k === "r" || k === "R") { setPlaying(false); seek(0); }
  else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
setTimeout(() => tick(true), 50);
</script>
